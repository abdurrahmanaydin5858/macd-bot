name: MACD AL/SAT Bot

on:
  # Sadece sabah 10:00'da bir kez başlar (UTC 07:00)
  # İçeride döngü var — 18:15'e kadar kendi kendine 15 dk'da bir çalışır
  schedule:
    - cron: '0 7 * * 1-5'   # Pzt-Cum 10:00 İstanbul = 07:00 UTC

  # Elle başlatma (test + hafta sonu)
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 510      # max 8.5 saat — GitHub'ın job limiti 6 saat, yeterlice

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance requests pandas numpy pytz

      - name: Botu çalıştır (içeride döngü var — 10:00–18:15 arası kendi kendine döner)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python macd_bot.py

      - name: Pozisyonları kaydet
        if: always()    # hata olsa bile kaydet
        run: |
          git config user.name  "MACD Bot"
          git config user.email "bot@users.noreply.github.com"
          git add pozisyonlar.csv
          git diff --staged --quiet || git commit -m "pozisyonlar $(date +'%d.%m.%Y %H:%M')"
          git push || true
