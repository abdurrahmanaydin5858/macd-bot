name: MACD AL/SAT Bot

on:
  # Her 15 dakikada bir — Pzt-Cum, 10:00–18:15 İstanbul (07:00–15:15 UTC)
  # Bu sayede stop-loss gün içinde tetiklenince anında Telegram'a gider
  schedule:
    - cron: '0,15,30,45 7,8,9,10,11,12,13,14 * * 1-5'   # 10:00–17:45
    - cron: '0,15 15 * * 1-5'                            # 18:00–18:15

  # Elle başlatma (test için)
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # pozisyonlar.csv commit edebilmek için

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri yükle
        run: pip install yfinance requests pandas numpy pytz

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python macd_bot.py

      - name: Pozisyonları kaydet
        run: |
          git config user.name  "MACD Bot"
          git config user.email "bot@users.noreply.github.com"
          git add pozisyonlar.csv
          git diff --staged --quiet || git commit -m "pozisyonlar $(date +'%d.%m.%Y %H:%M')"
          git push || true
