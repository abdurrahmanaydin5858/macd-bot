name: MACD AL/SAT Bot

on:
  # Her gün Pzt-Cum 18:10 İstanbul saati = 15:10 UTC (yaz saati, UTC+3)
  schedule:
    - cron: '10 15 * * 1-5'

  # Elle de çalıştırabilirsin (GitHub → Actions → Run workflow)
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    # pozisyonlar.csv'yi okuma/yazma izni
    permissions:
      contents: write

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri yükle
        run: pip install yfinance requests pandas numpy pytz

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python macd_bot.py

      - name: Pozisyonları kaydet (CSV değiştiyse commit at)
        run: |
          git config user.name  "MACD Bot"
          git config user.email "bot@users.noreply.github.com"
          git add pozisyonlar.csv
          git diff --staged --quiet || git commit -m "pozisyonlar güncellendi $(date +'%d.%m.%Y %H:%M')"
          git push || true
